<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
    <defs>
        <linearGradient id="bg" x2="1" y2="1">
            <stop stop-color="#071331"/>
            <stop offset="1" stop-color="#16051d"/>
        </linearGradient>
        <linearGradient id="bow" x2="1">
            <stop stop-color="#00f6ff"/>
            <stop offset="1" stop-color="#ff1493"/>
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect width="800" height="450" fill="url(#bg)"/>
    <path d="M0 370L160 270 280 340 430 210 570 320 800 180V450H0Z"
          fill="#071a35"/>
    <path d="M0 370L160 270 280 340 430 210 570 320 800 180"
          fill="none" stroke="#00f6ff" stroke-width="3" opacity=".45"/>

    <g filter="url(#glow)" fill="none" stroke="url(#bow)" stroke-width="10">
        <path d="M185 98 Q70 225 185 352"/>
        <path d="M185 98 Q280 225 185 352"/>
    </g>

    <line x1="185" y1="225" x2="690" y2="225"
          stroke="#ffe600" stroke-width="4" filter="url(#glow)"/>
    <path d="M690 225l-28-15v30z" fill="#ffe600" filter="url(#glow)"/>

    <g transform="translate(610 225)" fill="none" filter="url(#glow)">
        <circle r="78" stroke="#ff1493" stroke-width="9"/>
        <circle r="55" stroke="#fff" stroke-width="4"/>
        <circle r="31" stroke="#00f6ff" stroke-width="7"/>
        <circle r="10" fill="#ffe600" stroke="#ffe600" stroke-width="5"/>
        <path d="M-98 0h196M0-98v196" stroke="#ff1493" stroke-width="3"/>
    </g>

    <text x="38" y="58" fill="#00f6ff" font-family="Arial"
          font-size="25" font-weight="bold" letter-spacing="7">
        NEON ARCHER
    </text>
    <text x="40" y="405" fill="#ffe600" font-family="monospace"
          font-size="18" letter-spacing="4">
        PRECISION // AIM // STRIKE
    </text>
</svg>